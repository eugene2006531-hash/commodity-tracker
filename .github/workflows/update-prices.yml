name: 每日更新原物料價格

on:
  schedule:
    # UTC 22:00 = 台北時間隔日 06:00。可依需求調整。
    - cron: "0 22 * * *"
  workflow_dispatch: {}   # 允許在 GitHub 網頁上手動按「Run workflow」測試

permissions:
  contents: write   # 讓 workflow 可以把更新後的 data/prices.json 推回 repo

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出 repo
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取最新價格並更新 data/prices.json
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          METALS_API_KEY: ${{ secrets.METALS_API_KEY }}
        run: python scripts/update_prices.py

      - name: 如果有變動就 commit 並 push
        run: |
          git config user.name "commodity-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "資料沒有變化，不需要 commit。"
          else
            git commit -m "chore: update commodity prices $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: 發送 Telegram 通知
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 把下面這個網址換成你自己的 GitHub Pages 網址
          DASHBOARD_URL: "https://eugene2006531-hash.github.io/commodity-tracker/"
        run: python scripts/send_telegram.py
